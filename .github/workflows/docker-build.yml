name: Docker Build & Push

on:
  push:
    branches: [main, dev]
    paths:
      - 'api_gateway/**'
      - 'research_agent/**'
      - 'budget_agent/**'
      - 'booking_agent/**'
      - 'shared/**'
      - 'Dockerfile'
      - 'infra/docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build API Gateway image (dry-run on PR)
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: travelsouls/api-gateway:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Validate docker-compose
      run: |
        docker-compose -f infra/docker-compose.yml config > /dev/null && echo "docker-compose.yml is valid" || echo "docker-compose.yml has errors"
