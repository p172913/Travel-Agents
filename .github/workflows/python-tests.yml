name: Python Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api_gateway/requirements.txt

    - name: Run all tests with coverage
      run: |
        pytest --cov=research_agent --cov=budget_agent --cov=booking_agent \
               --cov=recommendation_agent --cov=orchestrator --cov=shared \
               --cov-report=xml --cov-report=term-summary \
               research_agent/ budget_agent/ booking_agent/ recommendation_agent/ \
               orchestrator/ api_gateway/ shared/ tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install lint tools
      run: pip install flake8 black isort
    - name: Check formatting
      run: black --check research_agent budget_agent booking_agent recommendation_agent orchestrator api_gateway shared tests || true
    - name: Lint
      run: flake8 research_agent budget_agent booking_agent recommendation_agent orchestrator api_gateway shared --max-line-length=120 --extend-ignore=E501 || true
