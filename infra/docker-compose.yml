version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: travelsouls_db
    restart: always
    environment:
      POSTGRES_DB: travelsouls
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - travelsouls_net

  redis:
    image: redis:7-alpine
    container_name: travelsouls_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - travelsouls_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: travelsouls_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@travelsouls.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - travelsouls_net

  api_gateway:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: travelsouls_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/travelsouls
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: 1
    depends_on:
      - db
      - redis
    networks:
      - travelsouls_net
    volumes:
      - ../:/app

volumes:
  pgdata:
  redisdata:

networks:
  travelsouls_net:
    driver: bridge
